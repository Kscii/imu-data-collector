# Copy outside the checkout and replace project, bucket, audience, and identities.
# These paths assume the service layout in docs/gcp-deployment.md.
activity_taxonomy_path: /opt/imu-annotation/current/configs/activities.yaml
calibration_evidence_path: /opt/imu-annotation/current/configs/calibration-evidence.yaml
device_registry_path: /opt/imu-annotation/current/configs/imu-devices.yaml
device_registry_auto_refresh: false
default_sensor_sn: null

identity:
  allowed_unikeys: [operator01]
  admins: [operator01]
  # Keep real account mappings in private server configuration.
  email_to_unikey:
    operator@example.com: operator01
  # Add a unique stable subject ID for each participant before production export.
  # Never reassign IDs. An empty mapping intentionally prevents participant export.
  subject_ids: {}

auth:
  mode: iap
  iap_audience: /projects/PROJECT_NUMBER/global/backendServices/BACKEND_SERVICE_ID

annotation:
  # The firewall must restrict this listener to the load balancer/health checkers.
  server_host: 0.0.0.0
  server_port: 8766
  catalog_path: /var/lib/imu-annotation/catalog.sqlite3
  catalog_refresh_interval_s: 10

storage:
  backend: gcs
  bucket: YOUR_PRIVATE_BUCKET
  project: YOUR_GCP_PROJECT
  cache_root: /var/lib/imu-annotation/cache

# The broker validates Google ID tokens independently of IAP.
cloud:
  broker_server_host: 127.0.0.1
  broker_server_port: 8770

# Enable only after configuring a separate provider worker and private environment.
external_devices:
  enabled: false
  access: members
  sync_interval_s: 900
  window_s: 86400
  overlap_s: 0
  history_start: '2026-08-31T16:00:00.000Z'
  request_timeout_s: 75
  max_response_bytes: 16777216
