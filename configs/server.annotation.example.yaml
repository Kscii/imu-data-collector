# 云端标注服务结构化配置示例；部署时复制到 /etc/imu-annotation/config.yaml。
activity_taxonomy_path: "/opt/imu-annotation/current/configs/activities.yaml"

identity:
  allowed_unikeys:
    - "rkim6933"
    - "zche0826"
    - "jzho8728"
    - "jzha9115"
    - "xfan0282"
    - "yniu0950"
    - "hche5673"
    - "jmia0254"
    - "xliu0452"
  admins:
    - "xfan0282"
  # 真实邮箱映射只写入服务器 /etc 配置，不提交仓库。
  email_to_unikey:
    "member@example.com": "xfan0282"

auth:
  mode: "iap"
  # 创建 backend service 后，用实际 project number 与 backend service ID 替换。
  iap_audience: "/projects/123456789/global/backendServices/123456789"

annotation:
  # 只允许负载均衡来源访问 8766；应用本身仍校验 IAP 签名 JWT。
  server_host: "0.0.0.0"
  server_port: 8766
  catalog_path: "/var/lib/imu-annotation/catalog.sqlite3"
  review_policy: "single_user"

storage:
  backend: "gcs"
  bucket: "soft3888-label"
  project: "project-51b589c7-8d5e-4e78-a10"
  cache_root: "/var/lib/imu-annotation/cache"
