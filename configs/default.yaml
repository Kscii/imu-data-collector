data_root: "~/IMUData"
activity_taxonomy_path: "configs/activities.yaml"
calibration_evidence_path: "configs/calibration-evidence.yaml"
server_host: "127.0.0.1"
server_port: 8765
minimum_free_gib: 20

capture:
  # 没有浏览器会话记录时，所有平台默认采集正式数据；正式质量门禁不会放宽。
  default_data_tier: "prod"

identity:
  # 参与者和标注者共用同一白名单；修改后需重启本地服务。
  allowed_unikeys:
    - "rkim6933"
    - "zche0826"
    - "jzho8728"
    - "jzha9115"
    - "xfan0282"
    - "yniu0950"
    - "hche5673"
    - "jmia0254"
    - "xliu0452"
  admins:
    - "xfan0282"

auth:
  # 本机和 SSH 隧道单人开发使用 local；开放团队访问前必须接入真实身份认证。
  mode: "local"
  iap_audience: null
  local_actor_id: "xfan0282"

annotation:
  # 独立标注应用；服务器同样只监听回环地址，通过 SSH 隧道访问。
  server_host: "127.0.0.1"
  server_port: 8766
  # 大于 0 时由服务器后台持续扫描新的完整 manifest；0 表示关闭后台扫描。
  catalog_refresh_interval_s: 10

storage:
  # 默认不接触云端；需要手动发布时用私有 YAML 切换到 gcs。
  backend: "local"
  bucket: null
  project: null

imu:
  name: "CW12EU-T"
  address: "83:FC:90:14:1E:A4"
  notify_uuid: "00002ae1-0000-1000-8000-00805f9b34fb"
  expected_rate_hz: 25.0
  expected_rate_status: "short_probe_observed_2026-08-25_pending_long_run"
  frame_size_bytes: 16
  # 仅适用于地址 83:FC:90:14:1E:A4 的当前设备；原始计数始终另外保留。
  calibration_profile_id: "cw12eu_t_83fc90141ea4_v1_20260827"
  calibration_verified: true
  accel_counts_per_g: 4096.0
  gyro_counts_per_dps: 32.8
  accel_bias_counts: [30.0, 48.0, -40.0]
  gyro_bias_counts: [-17.0, 0.0, 10.0]
  raw_axis_order: [0, 1, 2]
  axis_signs: [1, -1, 1]
  calibration_method: "six_face_static_and_multi_axis_360deg_engineering_v1"
  calibration_evidence_sha256: null

video:
  device: null
  # 首次由 WebUI 选择稳定 camera_id；device 仅用于显式调试覆盖。
  camera_id: null
  width: 1920
  height: 1080
  requested_fps: 30
  input_format: "mjpeg"
  bitrate: "6M"
  maxrate: "8M"
  preview_width: 640
  preview_fps: 10
  vaapi_device: "/dev/dri/renderD128"
  # 固定照明下锁定曝光，避免 C930c 自动曝光把输入帧率降到约 15 FPS。
  manual_controls_enabled: true
  auto_exposure: 1
  exposure_time_absolute: 200
  gain: 192
  exposure_dynamic_framerate: 0
  power_line_frequency: 1
  source_fps_window_seconds: 5.0
  prod_min_source_fps: 29.0
  prod_min_span_fps: 27.0

upload:
  enabled: false
  remote: "gdrive"
  remote_root: null

# 采集端的发布目的地必须显式声明。源码开发默认只写本地对象目录；团队桌面
# 安装包在 CI 中生成 broker 配置，不会把本地归档显示成 Bucket 上传。
publish:
  mode: "local"

# 团队桌面安装包通过 Google Desktop OAuth 登录，再由独立上传代理签发
# 单次、单录制的 GCS resumable upload 会话；安装包中不存放服务账号密钥。
cloud:
  broker_url: null
  # 仅供独立 imu-upload-broker 进程使用；桌面采集端不监听此端口。
  broker_server_host: "127.0.0.1"
  broker_server_port: 8770
  google_oauth_client_id: null
  model_publish_google_audiences:
    - 32555940559.apps.googleusercontent.com
  scopes: [openid, email, profile]

background_jobs:
  # 后台任务默认与采集低优先级并行；若实测影响帧率或丢包，改为 false 后重启。
  allow_during_recording: true
  # 首次执行失败后再自动重试三次。
  retry_delays_seconds: [5, 30, 120]
  poll_interval_seconds: 0.5
  subprocess_nice: 10
