<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>IMU 数据标注平台正在升级</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #e5eefc; background: radial-gradient(circle at 25% 15%, #16345d 0, #091426 42%, #050b16 100%); }
    main { width: min(620px, 100%); padding: 38px; border: 1px solid #29466d; border-radius: 18px; background: rgba(10, 24, 44, .92); box-shadow: 0 24px 80px rgba(0, 0, 0, .42); }
    .eyebrow { color: #60a5fa; font-size: 12px; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 16px 0 10px; font-size: clamp(28px, 6vw, 44px); line-height: 1.15; }
    p { margin: 8px 0; color: #afc1db; line-height: 1.75; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 22px; padding: 9px 13px; border-radius: 999px; color: #bfdbfe; background: #102d50; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #60a5fa; box-shadow: 0 0 18px #60a5fa; }
    small { display: block; margin-top: 24px; color: #6f86a6; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CW12EU-T · IMU ANNOTATION</div>
    <h1>平台正在升级</h1>
    <p>服务暂时停止，请稍后刷新页面。</p>
    <p>The annotation platform is temporarily unavailable while an upgrade is in progress.</p>
    <div class="status"><span class="dot"></span>升级维护中 · Maintenance in progress</div>
    <small>本页面每 30 秒自动刷新。</small>
  </main>
</body>
</html>
