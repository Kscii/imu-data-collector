name: 部署生产环境

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 输入 DEPLOY PRODUCTION
        required: true
        type: string
      keep_stopped:
        description: 切换版本后保持标注、上传和 GC 停机（仅供维护迁移）
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY PRODUCTION'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imu.kscii.tech
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 重新执行发布门禁
        run: |
          uv sync --frozen --dev
          uv run ruff check src tests scripts/verify-soft3888-compatibility.py
          uv run pytest -q
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: 生成最小部署包
        id: bundle
        run: |
          bundle="imu-annotation-${GITHUB_SHA}.tar.gz"
          deployer="imu-annotation-deploy-${GITHUB_SHA}"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --exclude='*/__pycache__' --exclude='*.pyc' -czf "${bundle}" \
            LICENSE README.md pyproject.toml uv.lock \
            configs/activities.yaml configs/calibration-evidence.yaml \
            configs/systemd/imu-annotation.service \
            configs/systemd/imu-annotation-gc.service \
            configs/systemd/imu-annotation-gc.timer \
            configs/systemd/imu-upload-broker.service \
            frontend/dist-annotation src
          install -m 0755 scripts/deploy/imu-annotation-deploy "${deployer}"
          digest="$(sha256sum "${bundle}" | cut -d ' ' -f 1)"
          deployer_digest="$(sha256sum "${deployer}" | cut -d ' ' -f 1)"
          echo "path=${bundle}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"
          echo "deployer_path=${deployer}" >> "${GITHUB_OUTPUT}"
          echo "deployer_sha256=${deployer_digest}" >> "${GITHUB_OUTPUT}"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: 验证大文件下载基础设施
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_SERVICE: ${{ vars.GCP_ANNOTATION_BACKEND || 'imu-annotation-backend' }}
        run: |
          timeout="$(gcloud compute backend-services describe "${BACKEND_SERVICE}" \
            --project "${PROJECT_ID}" --global --format='value(timeoutSec)')"
          if [[ "${timeout}" != 3600 ]]; then
            echo "${BACKEND_SERVICE} timeoutSec=${timeout}; run scripts/deploy/configure-large-downloads first" >&2
            exit 1
          fi
      - name: 通过 IAP 上传并原子部署
        env:
          BUNDLE: ${{ steps.bundle.outputs.path }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          DEPLOYER: ${{ steps.bundle.outputs.deployer_path }}
          DEPLOYER_SHA256: ${{ steps.bundle.outputs.deployer_sha256 }}
          KEEP_STOPPED: ${{ inputs.keep_stopped }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM }}
        run: |
          gcloud compute scp --quiet --tunnel-through-iap --scp-flag=-O \
            --project "${PROJECT_ID}" --zone "${ZONE}" \
            "${BUNDLE}" "${DEPLOYER}" "${VM}:/tmp/"
          gcloud compute ssh --quiet --tunnel-through-iap \
            --project "${PROJECT_ID}" --zone "${ZONE}" "${VM}" \
            --command "set -euo pipefail; \
              echo '${DEPLOYER_SHA256}  /tmp/${DEPLOYER}' | sha256sum --check --strict; \
              sudo install -o root -g root -m 0755 /tmp/${DEPLOYER} /usr/local/sbin/imu-annotation-deploy.next; \
              echo '${DEPLOYER_SHA256}  /usr/local/sbin/imu-annotation-deploy.next' | sudo sha256sum --check --strict; \
              if sudo /usr/local/sbin/imu-annotation-deploy.next /tmp/${BUNDLE} ${GITHUB_SHA} ${BUNDLE_SHA256} ${KEEP_STOPPED}; then \
                sudo mv -f /usr/local/sbin/imu-annotation-deploy.next /usr/local/sbin/imu-annotation-deploy; \
                rm -f /tmp/${DEPLOYER}; \
              else \
                sudo rm -f /usr/local/sbin/imu-annotation-deploy.next; \
                exit 1; \
              fi"
      - name: 验证公网入口
        if: ${{ !inputs.keep_stopped }}
        run: |
          curl --fail --silent --show-error --output /dev/null https://imu.kscii.tech/api/v1/health
          curl --fail --silent --show-error --output /dev/null https://upload.imu.kscii.tech/health
