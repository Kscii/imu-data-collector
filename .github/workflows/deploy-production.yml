name: 手动重试生产部署

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 已成功生成生产包的 main CI run ID
        required: true
        type: string
      confirmation:
        description: 输入 DEPLOY PRODUCTION
        required: true
        type: string
      keep_stopped:
        description: 切换版本后保持标注、上传和 GC 停机（仅供维护迁移）
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY PRODUCTION'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imu.kscii.tech
    steps:
      - name: 验证来源 CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "${RUN_ID}" =~ ^[0-9]+$ ]]
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r .name <<< "${payload}")" = "CI"
          test "$(jq -r .head_branch <<< "${payload}")" = "main"
          test "$(jq -r .conclusion <<< "${payload}")" = "success"
          echo "head_sha=$(jq -r .head_sha <<< "${payload}")" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v8
        with:
          name: imu-annotation-production-bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 校验生产包元数据
        env:
          EXPECTED_RELEASE_ID: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          source release-metadata.env
          test "${RELEASE_ID}" = "${EXPECTED_RELEASE_ID}"
          echo "${BUNDLE_SHA256}  ${BUNDLE}" | sha256sum --check --strict
          echo "${DEPLOYER_SHA256}  ${DEPLOYER}" | sha256sum --check --strict
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: 验证大文件下载基础设施
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_SERVICE: ${{ vars.GCP_ANNOTATION_BACKEND || 'imu-annotation-backend' }}
        run: |
          timeout="$(gcloud compute backend-services describe "${BACKEND_SERVICE}" \
            --project "${PROJECT_ID}" --global --format='value(timeoutSec)')"
          test "${timeout}" = 3600
      - name: 通过 IAP 上传并原子部署
        env:
          KEEP_STOPPED: ${{ inputs.keep_stopped }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM }}
        run: |
          set -euo pipefail
          source release-metadata.env
          gcloud compute scp --quiet --tunnel-through-iap --scp-flag=-O \
            --project "${PROJECT_ID}" --zone "${ZONE}" \
            "${BUNDLE}" "${DEPLOYER}" "${VM}:/tmp/"
          gcloud compute ssh --quiet --tunnel-through-iap \
            --project "${PROJECT_ID}" --zone "${ZONE}" "${VM}" \
            --command "set -euo pipefail; \
              echo '${DEPLOYER_SHA256}  /tmp/${DEPLOYER}' | sha256sum --check --strict; \
              sudo install -o root -g root -m 0755 /tmp/${DEPLOYER} /usr/local/sbin/imu-annotation-deploy.next; \
              echo '${DEPLOYER_SHA256}  /usr/local/sbin/imu-annotation-deploy.next' | sudo sha256sum --check --strict; \
              if sudo /usr/local/sbin/imu-annotation-deploy.next /tmp/${BUNDLE} ${RELEASE_ID} ${BUNDLE_SHA256} ${KEEP_STOPPED}; then \
                sudo mv -f /usr/local/sbin/imu-annotation-deploy.next /usr/local/sbin/imu-annotation-deploy; \
                rm -f /tmp/${DEPLOYER}; \
              else \
                sudo rm -f /usr/local/sbin/imu-annotation-deploy.next; \
                exit 1; \
              fi"
      - name: 验证公网入口
        if: ${{ !inputs.keep_stopped }}
        run: |
          curl --fail --silent --show-error --output /dev/null https://imu.kscii.tech/api/v1/health
          curl --fail --silent --show-error --output /dev/null https://upload.imu.kscii.tech/health
