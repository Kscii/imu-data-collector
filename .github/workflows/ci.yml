name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 与数据合同
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --frozen --dev
      - name: Ruff
        run: uv run ruff check src tests scripts/verify-soft3888-compatibility.py
      - name: Pytest
        run: uv run pytest -q
      - name: SOFT3888 temporal v3 合同
        run: uv run pytest -q tests/test_review_artifacts.py::test_aligned30_export_uses_three_root_datasets_and_exact_grid

  frontend:
    name: 两套前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装锁定依赖
        working-directory: frontend
        run: npm ci
      - name: 构建采集端与标注端
        working-directory: frontend
        run: npm run build
