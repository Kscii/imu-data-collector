name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 与数据合同
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --frozen --dev
      - name: Ruff
        run: uv run ruff check src tests scripts/verify-soft3888-compatibility.py
      - name: 本机更新脚本语法
        run: >-
          bash -n
          scripts/update-local-capture.sh
          scripts/install-user-service.sh
          scripts/deploy/imu-annotation-deploy
      - name: Pytest
        run: uv run pytest -q
      - name: SOFT3888 temporal v3 合同
        run: uv run pytest -q tests/test_review_artifacts.py::test_aligned_export_uses_three_root_datasets_and_exact_grid

  desktop-portability:
    name: 桌面兼容性 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --frozen --dev
      - name: 公共核心与平台适配测试
        run: uv run pytest -q
      - name: CLI 导入与主机诊断
        run: uv run imu-collector doctor --report-only

  frontend:
    name: 两套前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装锁定依赖
        working-directory: frontend
        run: npm ci
      - name: 构建采集端与标注端
        working-directory: frontend
        run: npm run build
