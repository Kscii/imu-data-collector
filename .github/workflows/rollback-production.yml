name: 回滚生产环境

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 已部署的 40 位 Git commit SHA
        required: true
        type: string
      confirmation:
        description: 输入 ROLLBACK PRODUCTION
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK PRODUCTION'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imu.kscii.tech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: 原子切回指定版本
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "${RELEASE_ID}" =~ ^[0-9a-f]{40}$ ]]
          gcloud compute ssh --quiet --tunnel-through-iap \
            --project "${PROJECT_ID}" --zone "${ZONE}" "${VM}" \
            --command "sudo /usr/local/sbin/imu-annotation-rollback ${RELEASE_ID}"
