name: 构建桌面安装包

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  scope:
    name: 判断是否影响桌面安装包
    runs-on: ubuntu-latest
    outputs:
      build_desktop: ${{ steps.scope.outputs.build_desktop }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: 区分标注端专属、共享前端与桌面端变更
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "scope=build" >> "${GITHUB_OUTPUT}"
            echo "手动运行或桌面版本标签：构建桌面安装包。"
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/desktop-scope-files"
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"
          scope="$(python3 scripts/desktop_ci_scope.py --null < "${changed_files}")"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "路径判定：${scope}"
      - uses: actions/setup-node@v7.0.0
        if: steps.classify.outputs.scope == 'compare_capture'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 比较 PR 前后的采集端 WebUI 产物
        id: compare
        if: steps.classify.outputs.scope == 'compare_capture'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_tree="${RUNNER_TEMP}/capture-base-tree"
          base_dist="${RUNNER_TEMP}/capture-base-dist"
          head_dist="${RUNNER_TEMP}/capture-head-dist"
          git worktree add --detach "${base_tree}" "${BASE_SHA}"
          (
            cd "${base_tree}/frontend"
            npm ci
            IMU_FRONTEND_OUT_DIR="${base_dist}" npm run build:capture
          )
          (
            cd frontend
            npm ci
            IMU_FRONTEND_OUT_DIR="${head_dist}" npm run build:capture
          )
          if diff --recursive --brief "${base_dist}" "${head_dist}"; then
            echo "capture_changed=false" >> "${GITHUB_OUTPUT}"
            echo "采集端产物逐文件一致。"
          else
            echo "capture_changed=true" >> "${GITHUB_OUTPUT}"
            echo "采集端产物发生变化。"
          fi
      - name: 输出桌面构建结论
        id: scope
        shell: bash
        env:
          SCOPE: ${{ steps.classify.outputs.scope }}
          CAPTURE_CHANGED: ${{ steps.compare.outputs.capture_changed }}
        run: |
          if [[ "${SCOPE}" == "skip" ]] || [[ "${SCOPE}" == "compare_capture" && "${CAPTURE_CHANGED}" == "false" ]]; then
            echo "build_desktop=false" >> "${GITHUB_OUTPUT}"
            echo "采集端不受影响：跳过 Windows/macOS 安装包。"
          else
            echo "build_desktop=true" >> "${GITHUB_OUTPUT}"
            echo "包含桌面端变更：构建 Windows/macOS 安装包。"
          fi

  windows:
    name: Windows 10/11 x64 安装器
    needs: scope
    if: needs.scope.outputs.build_desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 构建采集 WebUI
        working-directory: frontend
        run: npm ci && npm run build:capture
      - name: 准备固定版本 FFmpeg
        shell: pwsh
        run: ./packaging/windows/prepare-ffmpeg.ps1
      - name: 安装锁定依赖
        run: uv sync --frozen --dev --group package
      - name: 生成团队桌面配置
        shell: pwsh
        env:
          BROKER_URL: ${{ vars.DESKTOP_UPLOAD_BROKER_URL }}
          OAUTH_CLIENT_ID: ${{ vars.DESKTOP_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if (-not $env:BROKER_URL) { throw "缺少仓库变量 DESKTOP_UPLOAD_BROKER_URL" }
          if (-not $env:OAUTH_CLIENT_ID) { throw "缺少仓库变量 DESKTOP_GOOGLE_OAUTH_CLIENT_ID" }
          uv run python scripts/prepare_desktop_config.py --output build/desktop-config --broker-url $env:BROKER_URL --oauth-client-id $env:OAUTH_CLIENT_ID
          "IMU_DESKTOP_CONFIG_DIR=$((Resolve-Path build/desktop-config).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Windows 单元与平台适配测试
        run: uv run pytest -q
      - name: 解析安装器版本
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/desktop-v*") {
            $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          } else {
            $version = "0.2.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "无效的桌面版本：$version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 构建 onedir
        run: uv run --group package pyinstaller --noconfirm --clean packaging/imu_collector.spec
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "没有找到 Inno Setup 6 编译器" }
      - name: 构建安装器
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\imu-data-collector.iss'
      - name: 静默安装与打包 CLI 冒烟
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "IMUDataCollector"
          $process = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "安装器退出码：$($process.ExitCode)" }
          & (Join-Path $target "imu-collector.exe") doctor
      - name: 生成 SHA-256
        shell: pwsh
        run: Get-FileHash dist-installer\*.exe -Algorithm SHA256 | Format-List | Out-File dist-installer\SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v6
        with:
          name: imu-data-collector-windows-x64
          path: dist-installer/*

  macos:
    name: macOS 13+ ${{ matrix.arch }} DMG
    needs: scope
    if: needs.scope.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 校验 Runner 架构
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: 构建采集 WebUI
        working-directory: frontend
        run: npm ci && npm run build:capture
      - name: 安装锁定依赖
        run: uv sync --frozen --dev --group package
      - name: 生成团队桌面配置
        env:
          BROKER_URL: ${{ vars.DESKTOP_UPLOAD_BROKER_URL }}
          OAUTH_CLIENT_ID: ${{ vars.DESKTOP_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          test -n "${BROKER_URL}" || { echo "缺少仓库变量 DESKTOP_UPLOAD_BROKER_URL" >&2; exit 1; }
          test -n "${OAUTH_CLIENT_ID}" || { echo "缺少仓库变量 DESKTOP_GOOGLE_OAUTH_CLIENT_ID" >&2; exit 1; }
          uv run python scripts/prepare_desktop_config.py --output build/desktop-config --broker-url "${BROKER_URL}" --oauth-client-id "${OAUTH_CLIENT_ID}"
          echo "IMU_DESKTOP_CONFIG_DIR=$(pwd)/build/desktop-config" >> "${GITHUB_ENV}"
      - name: 解析应用版本
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            bundle_version="${version%%-*}"
          else
            version="0.2.0-dev.${GITHUB_RUN_NUMBER}"
            bundle_version="0.2.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$bundle_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "APP_VERSION=$version" >> "${GITHUB_ENV}"
          echo "APP_BUNDLE_VERSION=$bundle_version" >> "${GITHUB_ENV}"
      - uses: actions/cache@v6
        with:
          path: third_party/ffmpeg
          key: macos-ffmpeg-${{ matrix.arch }}-n8.1.2-b35605ace3ddf7c1a5d67a2eb553f034aef41d55-nasm2.16.03-v2
      - name: 从锁定源码构建 FFmpeg 与 x264
        run: ./packaging/macos/prepare-ffmpeg.sh
      - name: macOS 单元与平台适配测试
        run: uv run pytest -q
      - name: 生成应用图标
        run: uv run python packaging/macos/prepare-icon.py
      - name: 构建菜单栏应用
        run: uv run --group package pyinstaller --noconfirm --clean packaging/imu_collector.spec
      - name: ad-hoc 签名与应用结构验收
        run: |
          app="dist/IMU Data Collector.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = "true"
          file "$app/Contents/MacOS/IMU Data Collector" | grep -q "${{ matrix.arch }}"
          ffmpeg="$(find "$app/Contents" -type f -path '*/third_party/ffmpeg/bin/ffmpeg' -print -quit)"
          ffprobe="$(find "$app/Contents" -type f -path '*/third_party/ffmpeg/bin/ffprobe' -print -quit)"
          test -x "$ffmpeg" && test -x "$ffprobe"
          ! otool -L "$ffmpeg" | grep -E '/(opt/homebrew|usr/local)/'
          ! otool -L "$ffprobe" | grep -E '/(opt/homebrew|usr/local)/'
          "$ffmpeg" -hide_banner -encoders > build/encoders.txt 2>&1
          grep -q libx264 build/encoders.txt
          grep -q h264_videotoolbox build/encoders.txt
          "$ffmpeg" -hide_banner -loglevel error -f lavfi -i color=c=black:s=128x128:r=30 -frames:v 1 -c:v libx264 -f null /dev/null
          "$ffmpeg" -hide_banner -loglevel error -f lavfi -i color=c=black:s=128x128:r=30 -frames:v 1 -c:v h264_videotoolbox -allow_sw 1 -f null /dev/null
          "$app/Contents/MacOS/imu-collector" --help
      - name: 构建并挂载验收 DMG
        run: |
          ./packaging/macos/build-dmg.sh "${{ matrix.arch }}"
          dmg="$(find dist-installer -name '*.dmg' -print -quit)"
          mountpoint="${RUNNER_TEMP}/imu-data-collector-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
          test -d "$mountpoint/IMU Data Collector.app"
          hdiutil detach "$mountpoint"
          shasum -a 256 "$dmg" > "dist-installer/SHA256SUMS-macOS-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: imu-data-collector-macos-${{ matrix.arch }}
          path: dist-installer/*

  release:
    name: 发布 Windows 与 macOS 稳定 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: imu-data-collector-*
          path: release-artifacts
          merge-multiple: true
      - name: 创建稳定 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-artifacts/*
          --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
          --latest
          --notes "Windows 10/11 x64 与 macOS 13+（Apple Silicon、Intel）小组内部稳定版。当前安装包采用未公证的 ad-hoc 签名；Windows 首次安装可能出现 SmartScreen，macOS 首次启动请右键应用并选择‘打开’。"
